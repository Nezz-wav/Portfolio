<!doctype html>
<html lang="en" class="">
<head>
<meta charset="utf-8">

<title>Haldoren \u2014 Motion Design Portfolio</title>
<meta name="description" content="Motion design portfolio of E. Haldoren.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Caveat+Brush&family=Anton&display=swap" rel="stylesheet">

<body>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="plate" id="plate" alt="" decoding="async">
    <svg class="wm pre" id="wm" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-label="HALDOREN">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset=".5" stop-color="#f1f5f3" stop-opacity=".9"/><stop offset="1" stop-color="#d7e6de" stop-opacity=".28"/></linearGradient></defs>
      <text x="14" y="214" textLength="1412" lengthAdjust="spacingAndGlyphs" fill="url(#g1)">HALDOREN</text>
    </svg>
    <img class="cut" id="cut" alt="" decoding="async">
    <div class="badge pre" id="badge">
      <img id="badgeImg" alt="">
      <div class="card">
        <h4>DESIGNER<br>CARD</h4>
        <div class="yr">2026</div>
        <div class="role">ART DIRECTOR // DESIGNER</div>
        <div class="ph"></div>
        <div class="row"><span>NAME</span><b>E. HALDOREN</b></div>
        <div class="row"><span>FOCUS</span><b>MOTION DESIGN</b></div>
        <div class="row"><span>TG</span><b>@HALDOREN.MOTION</b></div>
        <div class="row"><span>EMAIL</span><b>HI@HALDOREN.STUDIO</b></div>
      </div>
      <div class="hit" id="hit"></div>
    </div>
    <div class="script pre" id="script">motion-design</div>
    <video class="trans" id="trans" muted playsinline preload="auto"></video>
    <img class="caseplate" id="caseplate" alt="" decoding="async">
    <div class="screen" id="screen"><div class="flash" id="flash"></div></div>
    <div class="screen-hit" id="screenHit"></div>
  </div>
</div>

<div class="ui" id="ui">
  <button class="tag t1 pre" id="tStudio">my studio</button>
  <button class="tag t2 pre" id="tPortfolio">portfolio</button>
  <a class="tag t3 pre" href="mailto:hi@haldoren.studio" id="tContacts">contacts</a>
  <a class="tag t4 pre" href="mailto:hi@haldoren.studio?subject=Project%20inquiry" id="tDiscuss">discuss a project</a>
  <button class="logo" id="logo">HALDOREN</button>

  <svg class="m-only m-wm pre" id="mWm" viewBox="0 0 1440 240" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset=".5" stop-color="#f1f5f3" stop-opacity=".9"/><stop offset="1" stop-color="#d7e6de" stop-opacity=".3"/></linearGradient></defs>
    <text x="10" y="210" textLength="1420" lengthAdjust="spacingAndGlyphs" fill="url(#g2)">HALDOREN</text>
  </svg>
  <div class="m-only m-script pre" id="mScript">motion-design</div>
  <div class="m-only m-badge" id="mBadgeBox"></div>

  <div class="ticket" id="ticket"><span class="h"></span><span class="h"></span><span class="h"></span><span class="h"></span>
    <h2 id="tTitle"></h2><div class="rows" id="tRows"></div></div>
  <div class="desc" id="desc"><div class="k" id="dKey"></div><p id="dText"></p><div class="num" id="dNum"></div></div>

  <button class="nav-case prev" id="prev"><div class="c"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div><span>previous <br>case</span></button>
  <button class="nav-case next" id="next"><div class="c"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><span>next <br>case</span></button>

  <div class="hint pre" id="hint"><i></i><span>scroll into the work</span></div>
</div>


<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>

</html>
